# Render Blueprint — one-click deploy of the GEO Auditor
# Uses the Dockerfile (multi-stage: Node builds frontend, Python runs backend).
# Create a free Web Service from this file: New → Blueprint → select this repo.
services:
  - type: web
    name: geo-auditor
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEO_LLM_PROVIDER
        value: groq
      - key: GROQ_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false   # set this in the Render dashboard after deploy
